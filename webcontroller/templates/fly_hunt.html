{% extends "base.html" %}
{% block content %}
<h3>Fly Hunt</h3>
<img src="/fly_hunt/video" alt="Fly Hunt Feed" style="max-width: 800px; width: auto; height: auto; border-radius: 0.5rem; box-shadow: 0 0 5px rgba(0,0,0,0.2);" />

<div style="margin-top: 20px;">
    <h4>Fly Hunt Logs</h4>
    <textarea id="flyHuntLogs" readonly style="width: 100%; max-width: 800px; height: 200px; font-family: monospace; font-size: 12px; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 0.375rem; padding: 10px; resize: vertical;">
Loading logs...
    </textarea>
</div>

<a href="/" onclick="stopFlyHunt()" class="button">⬅ Back</a>
<script>
    function stopFlyHunt() {
      navigator.sendBeacon('/fly_hunt/stop');
    }

    function updateLogs() {
        fetch('/fly_hunt/logs')
            .then(response => response.json())
            .then(data => {
                const logsTextarea = document.getElementById('flyHuntLogs');
                if (data.logs && data.logs.length > 0) {
                    logsTextarea.value = data.logs.join('\n');
                    logsTextarea.scrollTop = logsTextarea.scrollHeight;
                } else if (logsTextarea.value === 'Loading logs...') {
                    logsTextarea.value = 'No logs available';
                }
            })
            .catch(error => {
                console.error('Error fetching logs:', error);
                const logsTextarea = document.getElementById('flyHuntLogs');
                if (logsTextarea.value === 'Loading logs...') {
                    logsTextarea.value = 'Error loading logs';
                }
            });
    }

    setInterval(updateLogs, 2000);
    updateLogs();

    window.addEventListener('beforeunload', stopFlyHunt);
</script>
{% endblock %}
