{% extends "base.html" %}
{% block content %}
<h3>Live Camera</h3>
<img src="/video" alt="Live Feed" style="max-width: 800px; width: auto; height: auto; border-radius: 0.5rem; box-shadow: 0 0 5px rgba(0,0,0,0.2);" />

<div style="margin-top: 30px; display: flex; gap: 40px; flex-wrap: wrap;">
    <!-- Movement Controls -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
        <h4>Movement Control</h4>
        <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
            <button onclick="sendCommand('/control/move/forward')" style="padding: 12px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100px;">⬆ Forward</button>
            
            <div style="display: flex; gap: 10px;">
                <button onclick="sendCommand('/control/move/left')" style="padding: 12px 15px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; width: 80px;">⬅ Left</button>
                <button onclick="sendCommand('/control/stop')" style="padding: 12px 15px; font-size: 16px; background-color: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer; width: 80px;">⏹ Stop</button>
                <button onclick="sendCommand('/control/move/right')" style="padding: 12px 15px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; width: 80px;">Right ➡</button>
            </div>
            
            <button onclick="sendCommand('/control/move/backward')" style="padding: 12px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100px;">⬇ Backward</button>
        </div>
    </div>

    <!-- Camera Controls -->
    <div style="display: flex; flex-direction: column; gap: 15px; min-width: 250px;">
        <h4>Camera Control</h4>
        
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <label for="panSlider" style="font-weight: bold;">Pan (Horizontal):</label>
            <input type="range" id="panSlider" min="-90" max="90" value="0" style="cursor: pointer;">
            <span id="panValue" style="text-align: center; font-size: 14px;">0°</span>
            <button onclick="setPan()" style="padding: 8px 15px; font-size: 14px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">Set Pan</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
            <label for="tiltSlider" style="font-weight: bold;">Tilt (Vertical):</label>
            <input type="range" id="tiltSlider" min="-30" max="30" value="0" style="cursor: pointer;">
            <span id="tiltValue" style="text-align: center; font-size: 14px;">0°</span>
            <button onclick="setTilt()" style="padding: 8px 15px; font-size: 14px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">Set Tilt</button>
        </div>
    </div>
</div>

<div style="margin-top: 30px;">
    <h4>Camera Logs</h4>
    <textarea id="cameraLogs" readonly style="width: 100%; max-width: 800px; height: 200px; font-family: monospace; font-size: 12px; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 0.375rem; padding: 10px; resize: vertical;">
Loading logs...
    </textarea>
</div>

<a href="/" onclick="stopCamera()" class="button">⬅ Back</a>
<script>
    // Stop camera when leaving or refreshing the page
    function stopCamera() {
      navigator.sendBeacon('/stop_camera');
    }

    // Send control commands to the server
    function sendCommand(endpoint) {
        fetch(endpoint)
            .then(response => response.text())
            .then(data => console.log('Command response:', data))
            .catch(error => console.error('Error sending command:', error));
    }

    // Update pan value display when slider changes
    document.getElementById('panSlider').addEventListener('input', function() {
        document.getElementById('panValue').textContent = this.value + '°';
    });

    // Update tilt value display when slider changes
    document.getElementById('tiltSlider').addEventListener('input', function() {
        document.getElementById('tiltValue').textContent = this.value + '°';
    });

    // Set pan angle
    function setPan() {
        const angle = document.getElementById('panSlider').value;
        sendCommand(`/control/pan?angle=${angle}`);
    }

    // Set tilt angle
    function setTilt() {
        const angle = document.getElementById('tiltSlider').value;
        sendCommand(`/control/tilt?angle=${angle}`);
    }

    // Update camera logs
    function updateLogs() {
        fetch('/camera/logs')
            .then(response => response.json())
            .then(data => {
                const logsTextarea = document.getElementById('cameraLogs');
                if (data.logs && data.logs.length > 0) {
                    logsTextarea.value = data.logs.join('\n');
                    // Auto-scroll to bottom
                    logsTextarea.scrollTop = logsTextarea.scrollHeight;
                } else if (logsTextarea.value === 'Loading logs...') {
                    logsTextarea.value = 'No logs available';
                }
            })
            .catch(error => {
                console.error('Error fetching logs:', error);
                const logsTextarea = document.getElementById('cameraLogs');
                if (logsTextarea.value === 'Loading logs...') {
                    logsTextarea.value = 'Error loading logs';
                }
            });
    }

    // Update logs every 2 seconds
    setInterval(updateLogs, 2000);
    
    // Load logs immediately when page loads
    updateLogs();

    window.addEventListener('beforeunload', stopCamera);
</script>
{% endblock %}
