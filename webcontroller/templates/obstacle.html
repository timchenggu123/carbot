{% extends "base.html" %}
{% block content %}
<h3>Obstacle Avoidance</h3>

<div style="margin-top: 20px;">
    <h4>Obstacle Avoidance Logs</h4>
    <textarea id="obstacleLogs" readonly style="width: 100%; max-width: 1000px; height: 400px; font-family: monospace; font-size: 12px; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 0.375rem; padding: 10px; resize: vertical;">
Loading logs...
    </textarea>
</div>

<div style="margin-top: 20px;">
    <a href="/" onclick="stopObstacle()" class="button">⬅ Back</a>
</div>

<script>
    // Stop obstacle worker when leaving or refreshing the page
    function stopObstacle() {
        navigator.sendBeacon('/obstacle/stop');
    }

    // Update obstacle logs
    function updateLogs() {
        fetch('/obstacle/logs')
            .then(response => response.json())
            .then(data => {
                const logsTextarea = document.getElementById('obstacleLogs');
                if (data.logs && data.logs.length > 0) {
                    logsTextarea.value = data.logs.join('\n');
                    // Auto-scroll to bottom
                    logsTextarea.scrollTop = logsTextarea.scrollHeight;
                } else if (logsTextarea.value === 'Loading logs...') {
                    logsTextarea.value = 'No logs available';
                }
            })
            .catch(error => {
                console.error('Error fetching logs:', error);
                const logsTextarea = document.getElementById('obstacleLogs');
                if (logsTextarea.value === 'Loading logs...') {
                    logsTextarea.value = 'Error loading logs';
                }
            });
    }

    // Update logs every 500 milliseconds
    setInterval(updateLogs, 500);
    
    // Load logs immediately when page loads
    updateLogs();

    window.addEventListener('beforeunload', stopObstacle);
</script>
{% endblock %}
